<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استعلام نتائج الطالبات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/report.css">
<style>
/* Layout: one calm column. A lookup slip on top; the result opens beneath it as a report card with a score ring, four measure tiles, learning style and signatures. */
:root {
  --bg: #eef4f2;
  --surface: #ffffff;
  --surface-2: #f5f9f8;
  --ink: #142a2e;
  --muted: #5b7277;
  --line: #d7e4e1;
  --accent: #0d6e6a;
  --accent-soft: #d6ece9;
  --gold: #b9800f;
  --gold-soft: #fbefd3;
  --good: #1f8a4c;
  --warn: #b86a00;
  --low: #b43c3c;
  --pattern: rgba(13, 110, 106, 0.07);
  --viewer: #4d5d60;
  --shadow: 0 1px 2px rgba(20, 42, 46, 0.06), 0 12px 32px -12px rgba(20, 42, 46, 0.18);
  --font-display: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1a1c; --surface: #142427; --surface-2: #192d31; --ink: #e6f0ee; --muted: #93aaae;
    --line: #26403f; --accent: #4fc2b8; --accent-soft: #163a3a; --gold: #e9b44c; --gold-soft: #3a2e14;
    --good: #5fcf8c; --warn: #f0a540; --low: #f08080; --pattern: rgba(79, 194, 184, 0.06); --viewer: #060d0e;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -12px rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1a1c; --surface: #142427; --surface-2: #192d31; --ink: #e6f0ee; --muted: #93aaae;
  --line: #26403f; --accent: #4fc2b8; --accent-soft: #163a3a; --gold: #e9b44c; --gold-soft: #3a2e14;
  --good: #5fcf8c; --warn: #f0a540; --low: #f08080; --pattern: rgba(79, 194, 184, 0.06); --viewer: #060d0e;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -12px rgba(0,0,0,.6); color-scheme: dark;
}

html { direction: rtl; }
* { box-sizing: border-box; }
body {
  background: var(--bg);
  background-image:
    radial-gradient(circle at 1px 1px, var(--pattern) 1.5px, transparent 0);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.7;
  min-height: 100vh;
}
.wrap {
  max-width: 760px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 56px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* Header */
.masthead { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.logos {
  display: flex; align-items: center; justify-content: center; gap: 20px;
  background: #ffffff; border: 1px solid var(--line); border-radius: 20px;
  padding: 14px 24px; margin-bottom: 10px; box-shadow: var(--shadow);
  max-width: 100%;
}
.logo { width: 150px; max-width: 40vw; height: auto; display: block; }
.logo-sep { width: 1px; align-self: stretch; background: #d7e4e1; }
.eyebrow { color: var(--accent); font-weight: 600; font-size: 14px; letter-spacing: .02em; }
h1 {
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(28px, 6vw, 40px); line-height: 1.3; margin: 0;
  text-wrap: balance;
}
.sub { color: var(--muted); margin: 0; font-size: 15px; }

/* Lookup */
[hidden] { display: none !important; }
.lookup {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 24px;
  display: flex; flex-direction: column; gap: 14px;
}
.lookup label { font-weight: 600; font-size: 15px; }
.field { display: flex; gap: 10px; flex-wrap: wrap; }
.field input {
  flex: 1 1 220px; min-width: 0;
  font: inherit; font-size: 20px; letter-spacing: .12em;
  font-variant-numeric: tabular-nums;
  direction: ltr; text-align: center;
  padding: 12px 16px;
  border: 2px solid var(--line); border-radius: 14px;
  background: var(--surface-2); color: var(--ink);
  transition: border-color .15s, box-shadow .15s;
}
.field input::placeholder { letter-spacing: .04em; color: var(--muted); opacity: .7; }
.field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.btn {
  font: inherit; font-weight: 700; font-size: 16px;
  padding: 12px 28px; border-radius: 14px; border: 0; cursor: pointer;
  background: var(--accent); color: var(--surface);
  transition: transform .1s, filter .15s;
}
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .7; cursor: wait; }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, .chip:focus-visible, .ghost:focus-visible, .copy:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.error {
  margin: 0; padding: 10px 14px; border-radius: 12px;
  background: color-mix(in srgb, var(--low) 12%, transparent); color: var(--low);
  font-weight: 500; font-size: 14px;
}
.samples { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); padding-top: 4px; border-top: 1px dashed var(--line); }
.chip {
  font: inherit; font-size: 13px; direction: ltr; font-variant-numeric: tabular-nums;
  padding: 4px 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
}
.chip:hover { border-color: var(--accent); color: var(--accent); }

/* Result card */
.result {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 24px;
  box-shadow: var(--shadow);
  overflow: hidden;
  animation: rise .45s ease-out both;
}
@keyframes rise { from { transform: translateY(12px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .result, .ring-fg { animation: none !important; transition: none !important; } }

.praise {
  display: flex; gap: 14px; align-items: center;
  padding: 16px 24px;
  background: var(--gold-soft); color: var(--ink);
  border-bottom: 1px solid var(--line);
}
.praise .star { flex: none; width: 40px; height: 40px; color: var(--gold); }
.praise strong { font-family: var(--font-display); font-size: 19px; display: block; line-height: 1.4; color: var(--gold); }
.praise span { font-size: 14.5px; }
.praise.calm { background: var(--accent-soft); }
.praise.calm strong, .praise.calm .star { color: var(--accent); }

.r-head {
  display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center;
  padding: 24px;
}
.r-head > div { min-width: 0; }
.r-label { color: var(--muted); font-size: 13px; }
.r-name { font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 5vw, 30px); line-height: 1.35; margin: 2px 0 10px; text-wrap: balance; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font-size: 13px; padding: 3px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tag.id { background: var(--surface-2); color: var(--muted); direction: ltr; font-variant-numeric: tabular-nums; font-weight: 500; border: 1px solid var(--line); }

.ring { position: relative; width: 116px; height: 116px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--surface-2); stroke-width: 10; }
.ring-fg { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 1s ease-out; }
.ring-val { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.1; }
.ring-val b { font-size: 28px; font-variant-numeric: tabular-nums; }
.ring-val small { font-size: 11.5px; color: var(--muted); }

.metrics {
  display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 12px;
  padding: 0 24px 24px;
}
.metric {
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 16px;
  padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
}
.m-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.m-name { font-size: 14px; color: var(--muted); font-weight: 500; }
.m-val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.m-val small { font-size: 13px; color: var(--muted); font-weight: 500; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.m-note { font-size: 12.5px; color: var(--muted); }
.pill { font-size: 12px; font-weight: 600; padding: 1px 10px; border-radius: 99px; }
.pill.good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.pill.low  { color: var(--low);  background: color-mix(in srgb, var(--low) 14%, transparent); }

.tests { padding: 0 24px 16px; }
.tests-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.tests-title { font-weight: 700; font-size: 16px; }
.tests-grid {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--surface-2);
}
.t-cell { padding: 14px 10px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
.t-cell + .t-cell { border-inline-start: 1px solid var(--line); }
.t-label { font-size: 13px; color: var(--muted); }
.t-val { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; }
.t-val small { font-size: 13px; color: var(--muted); font-weight: 500; }
.t-cell.key { background: var(--accent-soft); }
.t-cell.key .t-val { color: var(--accent); }
.section { padding: 20px 24px; border-top: 1px solid var(--line); display: flex; gap: 16px; align-items: center; }
.section > div { min-width: 0; }
.style-icon {
  flex: none; width: 52px; height: 52px; border-radius: 16px;
  display: grid; place-items: center; background: var(--accent-soft); color: var(--accent);
}
.style-icon svg { width: 28px; height: 28px; }
.s-title { font-weight: 700; font-size: 17px; }
.s-text { color: var(--muted); font-size: 14px; margin: 0; }

.email-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.email { direction: ltr; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 14.5px; overflow-wrap: anywhere; user-select: all; }
.copy {
  font: inherit; font-size: 12.5px; padding: 3px 12px; border-radius: 99px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--accent); font-weight: 600;
}

.signs {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  border-top: 1px solid var(--line); background: var(--surface-2);
}
.sign { padding: 18px 24px; text-align: center; }
.sign + .sign { border-inline-start: 1px solid var(--line); }
.sign .r-label { display: block; }
.sign b { font-family: var(--font-display); font-weight: 600; font-size: 17px; }

.actions { display: flex; justify-content: center; }
.ghost {
  font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;
  background: transparent; color: var(--accent); border: 1.5px solid var(--accent);
  padding: 8px 22px; border-radius: 12px;
}
.ghost:hover { background: var(--accent-soft); }

.foot { text-align: center; color: var(--muted); font-size: 12.5px; }
.sample-note { display: inline-block; margin-top: 4px; padding: 2px 10px; border-radius: 99px; background: var(--gold-soft); color: var(--gold); font-weight: 600; }

@media (max-width: 520px) {
  .wrap { padding-block: 24px 40px; }
  .lookup, .r-head, .praise { padding-inline: 18px; }
  .metrics { padding-inline: 18px; grid-template-columns: minmax(0, 1fr); }
  .tests { padding-inline: 18px; }
  .tests-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .t-cell:nth-child(3) { border-inline-start: 0; }
  .t-cell:nth-child(n+3) { border-top: 1px solid var(--line); }
  .section, .sign { padding-inline: 18px; }
  .r-head { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
  .tags { justify-content: center; }
  .btn { flex: 1 1 100%; }
}
.actions { gap: 10px; flex-wrap: wrap; }
.closed { background: var(--surface, #fff); border: 1px solid var(--line); border-radius: 18px; padding: 28px 20px; text-align: center; box-shadow: var(--shadow); }
.closed svg { width: 40px; height: 40px; color: var(--accent); }
.closed p { margin: 10px 0 0; font-size: 17px; font-weight: 600; }
.btn-pdf { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 22px; font-size: 15px; }
.btn-pdf svg { width: 18px; height: 18px; }
.btn-soft { background: var(--accent-soft); color: var(--accent); }

/* The result card on screen exactly as it prints: the A4 page fitted to the width, over a dark backdrop. */
.viewer {
  position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none;
  margin: 0; padding: 0; border: 0; overflow: hidden; background: var(--viewer); color: var(--ink);
}
.viewer[open] { display: flex; flex-direction: column; }
.viewer::backdrop { background: var(--viewer); }
.viewer-bar {
  flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.viewer-bar b { font-size: 16px; }
.viewer-actions { display: flex; gap: 8px; }
.viewer-bar .btn { flex: none; padding: 7px 14px; font-size: 14px; }
.viewer-close { padding: 6px 14px; font-size: 14px; }
.viewer-body { flex: 1; overflow: auto; overscroll-behavior: contain; padding: 16px 12px max(16px, env(safe-area-inset-bottom, 0px)); }
.sheet-page {
  position: relative; overflow: hidden; margin: 0 auto; background: #fff;
  width: calc(210mm * var(--s, 1)); height: calc(297mm * var(--s, 1));
  box-shadow: 0 2px 6px rgba(0, 0, 0, .25), 0 16px 40px -12px rgba(0, 0, 0, .45);
}
.sheet-page .rpt { position: absolute; top: 0; left: 0; width: 210mm; transform: scale(var(--s, 1)); transform-origin: 0 0; }
html.viewing { overflow: hidden; }

/* Class comparison, progress across terms, study tips */
.block, .study { padding: 20px 24px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.block-head { display: flex; justify-content: space-between; align-items: center; gap: 6px 12px; flex-wrap: wrap; }
.block-title, .sub-title { font-weight: 700; font-size: 16px; }
.sub-title { font-size: 15px; margin-bottom: 8px; }
.key { display: inline-flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
.key span { display: inline-flex; align-items: center; gap: 6px; }
.key .k-you::before { content: ""; width: 16px; height: 8px; border-radius: 99px; background: var(--accent); }
.key .k-avg::before { content: ""; width: 3px; height: 14px; border-radius: 2px; background: var(--ink); }
.cmp-sum { margin: 0; padding: 10px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font-size: 14px; }
.cmp-sum b { display: block; font-size: 15px; }
.cmp { display: flex; flex-direction: column; gap: 14px; }
.cmp-row { display: flex; flex-direction: column; gap: 7px; }
.cmp-top { display: flex; justify-content: space-between; align-items: baseline; gap: 2px 10px; flex-wrap: wrap; font-size: 14px; }
.cmp-name { font-weight: 600; }
.cmp-vals { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cmp-vals b { color: var(--ink); font-size: 14.5px; }
.cmp-track { position: relative; height: 10px; border-radius: 99px; background: var(--line); }
.cmp-track i { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: inherit; background: var(--accent); }
.cmp-track s { position: absolute; top: -4px; bottom: -4px; width: 3px; margin-inline-start: -1.5px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 2px var(--surface); }
.prog { display: flex; flex-direction: column; gap: 10px; }
.prog-row { display: grid; grid-template-columns: minmax(0, 10em) minmax(0, 1fr) 3em; gap: 12px; align-items: center; font-size: 14px; }
.prog-name { color: var(--muted); line-height: 1.45; }
.prog-row.now .prog-name { color: var(--ink); font-weight: 600; }
.prog-track { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.prog-track i { display: block; height: 100%; border-radius: inherit; background: var(--muted); }
.prog-row.now .prog-track i { background: var(--accent); }
.prog-val { font-weight: 700; font-variant-numeric: tabular-nums; text-align: end; }
.study-head { display: flex; gap: 16px; align-items: center; }
.study-head > div { min-width: 0; }
.tips { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; counter-reset: tip; }
.tips li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14.5px; counter-increment: tip; }
.tips li::before { content: counter(tip); width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; display: grid; place-items: center; line-height: 1; }
.next { background: var(--gold-soft); border-radius: 14px; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; }
.next b { font-size: 14.5px; }
.next p { margin: 0; font-size: 14.5px; }
.no-grades { margin: 0 24px 24px; padding: 18px; border: 1.5px dashed var(--line); border-radius: 16px; text-align: center; color: var(--muted); font-weight: 600; }
@media (max-width: 520px) {
  .block, .study { padding-inline: 18px; }
  .no-grades { margin-inline: 18px; }
  .prog-row { grid-template-columns: minmax(0, 7.5em) minmax(0, 1fr) 2.8em; gap: 10px; }
}
</style>
</head>
<body>

<div class="wrap" dir="rtl" lang="ar">
  <header class="masthead">
    <div class="logos">
      <img class="logo" src="/img/moe.webp" alt="وزارة التعليم" width="150" height="113">
      <span class="logo-sep" aria-hidden="true"></span>
      <img class="logo" src="/img/school.webp" alt="الثانوية الثامنة والخمسون بعد المائة" width="150" height="131">
    </div>
    <div class="eyebrow" id="gradeLabel">المرحلة الثانوية</div>
    <h1>استعلام نتائج الطالبات</h1>
    <p class="sub">اكتبي رقم الهوية لتظهر بطاقة النتيجة كاملة</p>
  </header>

  <form class="lookup" id="lookupForm" novalidate>
    <label for="nid">رقم الهوية الوطنية</label>
    <div class="field">
      <input id="nid" name="nid" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="١٠ أرقام" aria-describedby="nidHint">
      <button class="btn" type="submit">استعلام</button>
    </div>
    <p class="hint" id="nidHint">رقم الهوية مكوّن من 10 أرقام</p>
    <p class="error" id="err" role="alert" hidden></p>
  </form>

  <section id="result" aria-live="polite" hidden></section>

  <div class="closed" id="closedBox" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    <p id="closedMsg"></p>
  </div>

  <footer class="foot" id="foot">
    المعلمة: فائزة محمد جبوع · المديرة: د. حنان المطيري
  </footer>
</div>

<dialog class="viewer" id="viewer" aria-labelledby="viewerTitle">
  <div class="viewer-bar">
    <b id="viewerTitle">بطاقة النتيجة</b>
    <div class="viewer-actions">
      <button class="btn btn-pdf" type="button" id="viewerPdf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>تحميل PDF</button>
      <button class="ghost viewer-close" type="button" id="viewerClose" autofocus>إغلاق</button>
    </div>
  </div>
  <div class="viewer-body" id="viewerBody"><div class="sheet-page" id="sheetPage"></div></div>
</dialog>

<script src="/report.js"></script>
<script>
document.documentElement.dir = "rtl";
document.documentElement.lang = "ar";
// ===== إعدادات الدرجات =====
const MAX = { test: 20, participation: 10, projects: 10, homework: null, final: null };
// Overwritten from /api/site, which the teacher controls from the panel.
const SITE = { gradeLabel: "المرحلة الثانوية", termTitle: "", teacherName: "فائزة محمد جبوع", principalName: "د. حنان المطيري" };
const gradeLine = () => Report.gradeLine(SITE);
const { fmt, esc, level, praiseFor } = Report;

async function findStudent(id) {
  const res = await fetch("/api/lookup", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }) });
  if (res.status === 404) return null;
  if (res.status === 403) return "closed";
  if (res.status === 429) throw new Error("rate_limited");
  if (!res.ok) throw new Error("server_error");
  return res.json();
}
const $ = s => document.querySelector(s);

function toLatin(s) {
  return s.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/\D/g, "");
}

function metric(name, val, max) {
  if (val == null) return `<div class="metric">
    <div class="m-top"><span class="m-name">${name}</span></div>
    <div class="m-val">— <small>/ ${max}</small></div>
    <div class="m-note">لم تُرصد بعد</div>
  </div>`;
  const p = Math.max(0, Math.min(1, val / max));
  const [c, t] = level(p);
  return `<div class="metric">
    <div class="m-top"><span class="m-name">${name}</span><span class="pill ${c}">${t}</span></div>
    <div class="m-val">${fmt(val)} <small>/ ${max}</small></div>
    <div class="bar" role="img" aria-label="${Math.round(p * 100)}%"><i style="width:${p * 100}%"></i></div>
  </div>`;
}

// One row: the student's bar, with a tick where the class average sits.
function cmpRow(name, mine, avg, max, mineText, avgText) {
  const at = v => Math.max(0, Math.min(100, (v / max) * 100));
  return `<div class="cmp-row">
    <div class="cmp-top"><span class="cmp-name">${name}</span><span class="cmp-vals">درجتك <b>${mineText}</b> · متوسط الفصل ${avgText}</span></div>
    <div class="cmp-track" role="img" aria-label="${name}: درجتك ${mineText}، ومتوسط الفصل ${avgText}">${mine == null ? "" : `<i style="width:${at(mine)}%"></i>`}${avg == null ? "" : `<s style="inset-inline-start:${at(avg)}%"></s>`}</div>
  </div>`;
}

function compareBlock(sc, cs) {
  const v = Report.versusClass(sc, cs);
  const of = (x, m) => (x == null ? "—" : `${fmt(x)} من ${m}`);
  return `<div class="block">
    <div class="block-head"><span class="block-title">مقارنة بمتوسط الفصل</span><span class="key" aria-hidden="true"><span class="k-you">درجتك</span><span class="k-avg">متوسط الفصل</span></span></div>
    <p class="cmp-sum"><b>${esc(v.title)}</b>${esc(v.text)}</p>
    <div class="cmp">
      ${cmpRow("الاختبارات", sc.test, cs.test, MAX.test, of(sc.test, MAX.test), fmt(cs.test))}
      ${cmpRow("المشاركة", sc.part, cs.participation, MAX.participation, of(sc.part, MAX.participation), fmt(cs.participation))}
      ${cmpRow("المشاريع والمهام", sc.proj, cs.projects, MAX.projects, of(sc.proj, MAX.projects), fmt(cs.projects))}
      ${Report.extrasOf(MAX).map(k => cmpRow(Report.EXTRAS[k], sc[k], cs[k], MAX[k], of(sc[k], MAX[k]), fmt(cs[k]))).join("")}
      ${cmpRow("النسبة الكلية", sc.pct, cs.pct, 100, sc.pct + "%", cs.pct + "%")}
    </div>
    <p class="hint">المتوسط محسوب من درجات طالبات فصلك، ولا يظهر فيه اسم أو درجة أي طالبة.</p>
  </div>`;
}

function progressBlock(pg) {
  return `<div class="block">
    <div class="block-head"><span class="block-title">تقدّمك عبر الفترات</span>${pg.trend ? `<span class="pill ${pg.trend.kind}">${pg.trend.text}</span>` : ""}</div>
    <div class="prog">${pg.rows.map(x => `<div class="prog-row${x.now ? " now" : ""}">
      <span class="prog-name">${esc(x.title)}</span>
      <div class="prog-track" role="img" aria-label="${esc(x.title)}: ${x.pct}%"><i style="width:${Math.min(100, x.pct)}%"></i></div>
      <span class="prog-val">${x.pct}%</span></div>`).join("")}</div>
  </div>`;
}

function studyBlock(style, steps) {
  const st = Report.styleOf(style);
  return `<div class="study">
    <div class="study-head">
      <div class="style-icon" aria-hidden="true">${st.icon}</div>
      <div><div class="r-label">نمط التعلم</div><div class="s-title">${esc(style || "لم يُحدَّد بعد")}</div><p class="s-text">${esc(st.tip)}</p></div>
    </div>
    <div><div class="sub-title">نصائح مذاكرة تناسبك</div><ol class="tips">${st.tips.map(t => `<li>${esc(t)}</li>`).join("")}</ol></div>
    <div class="next"><b>خطوتك القادمة</b>${steps.map(t => `<p>${esc(t)}</p>`).join("")}</div>
  </div>`;
}

// ===== تصدير بطاقة النتيجة PDF =====
let currentStudent = null;

async function downloadPdf(btn) {
  if (!currentStudent) return;
  fetch("/api/lookup/pdf", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: currentStudent.id }) }).catch(() => {});
  const label = btn.innerHTML;
  btn.disabled = true; btn.textContent = "جارٍ تجهيز الملف…";
  try {
    const blob = await Report.toPdf([Report.cardSheet(currentStudent, { max: MAX, site: SITE })]);
    Report.save(blob, `نتيجة - ${currentStudent.name}.pdf`);
  } catch (err) {
    console.error(err);
    if (viewer.open) viewer.close();
    showError("تعذّر تجهيز ملف PDF. تأكدي من اتصال الإنترنت وحاولي مرة أخرى.");
  } finally {
    btn.disabled = false; btn.innerHTML = label;
  }
}

// ===== مشاهدة البطاقة كما تُطبع، بدون تحميل =====
const viewer = $("#viewer");
// The A4 page shrinks to fit the screen's width, and never grows past its real size.
function fitSheet() {
  const page = $("#sheetPage"), sheet = page.querySelector(".rp-sheet");
  if (sheet) page.style.setProperty("--s", Math.min(1, ($("#viewerBody").clientWidth - 24) / sheet.offsetWidth));
}
async function openViewer() {
  if (!currentStudent) return;
  await document.fonts.ready;
  Report.show($("#sheetPage"), [Report.cardSheet(currentStudent, { max: MAX, site: SITE })]);
  document.documentElement.classList.add("viewing");
  viewer.showModal();
  fitSheet();
  $("#viewerBody").scrollTop = 0;
}
viewer.addEventListener("close", () => { document.documentElement.classList.remove("viewing"); $("#sheetPage").innerHTML = ""; });
$("#viewerClose").addEventListener("click", () => viewer.close());
$("#viewerPdf").addEventListener("click", e => downloadPdf(e.currentTarget));
addEventListener("resize", () => { if (viewer.open) fitSheet(); });

function render(r) {
  currentStudent = r;
  const { id, name, class: cls, learningStyle: style, email } = r;
  const sc = Report.scores(r, MAX);
  const first = name.split(" ")[0];
  const pr = sc.has ? praiseFor(sc.pct, first)
    : { cls: "calm", icon: Report.SPROUT, title: `أهلاً يا ${first}`, text: "لم تكتمل درجات هذه الفترة بعد، وستظهر نسبتك هنا فور رصدها." };
  const pg = Report.progress(r.history, sc, SITE.termTitle);
  const C = 2 * Math.PI * 48;
  // Homework and the final exam show once the teacher counts them. Four tiles sit two by two.
  const tiles = [metric("المشاركة", sc.part, MAX.participation), metric("المشاريع والمهام", sc.proj, MAX.projects),
    ...Report.extrasOf(MAX).map(k => metric(Report.EXTRAS[k], sc[k], MAX[k]))];
  const results = sc.any ? `
    <div class="tests">
      <div class="tests-head"><span class="tests-title">الاختبارات</span>${sc.test == null ? "" : (() => { const [c, t] = level(sc.test / MAX.test); return `<span class="pill ${c}">${t}</span>`; })()}</div>
      <div class="tests-grid">
        <div class="t-cell"><span class="t-label">الاختبار الأول</span><span class="t-val">${fmt(sc.t1)} <small>/ ${MAX.test}</small></span></div>
        <div class="t-cell"><span class="t-label">الاختبار الثاني</span><span class="t-val">${fmt(sc.t2)} <small>/ ${MAX.test}</small></span></div>
        <div class="t-cell"><span class="t-label">المجموع</span><span class="t-val">${fmt(sc.t1 != null && sc.t2 != null ? sc.t1 + sc.t2 : null)} <small>/ ${MAX.test * 2}</small></span></div>
        <div class="t-cell key"><span class="t-label">المتوسط</span><span class="t-val">${fmt(sc.test)} <small>/ ${MAX.test}</small></span></div>
      </div>
    </div>
    <div class="metrics" style="--cols:${tiles.length === 3 ? 3 : 2}">${tiles.join("")}</div>` : `<p class="no-grades">لم تُرصد درجات هذه الفترة بعد.</p>`;

  $("#result").innerHTML = `
  <article class="result">
    <div class="praise ${pr.cls}">${pr.icon}<div><strong>${esc(pr.title)}</strong><span>${esc(pr.text)}</span></div></div>
    <div class="r-head">
      <div>
        <div class="r-label">اسم الطالبة</div>
        <div class="r-name">${esc(name)}</div>
        <div class="tags"><span class="tag">${cls ? esc(r.classLabel || cls) + (r.track ? ` · ${esc(r.track)}` : "") : esc(SITE.gradeLabel)}</span><span class="tag id">${esc(id)}</span></div>
      </div>
      ${sc.has ? `<div class="ring" role="img" aria-label="المجموع ${sc.pct}%">
        <svg viewBox="0 0 116 116"><circle class="ring-bg" cx="58" cy="58" r="48"/><circle class="ring-fg" id="ringFg" cx="58" cy="58" r="48" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
        <div class="ring-val"><b>${sc.pct}%</b><small>${fmt(sc.total)} من ${sc.maxTotal}</small></div>
      </div>` : ""}
    </div>
    ${results}
    ${sc.has && r.classStats ? compareBlock(sc, r.classStats) : ""}
    ${r.history?.length && pg.rows.length ? progressBlock(pg) : ""}
    ${studyBlock(style, Report.nextSteps(sc, MAX))}
    <div class="section">
      <div class="style-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div>
      <div><div class="r-label">الإيميل الوزاري</div><div class="email-row"><span class="email" id="emailText">${esc(email)}</span><button class="copy" type="button" id="copyBtn">نسخ</button></div></div>
    </div>
    <div class="signs">
      <div class="sign"><span class="r-label">المعلمة</span><b>${esc(SITE.teacherName)}</b></div>
      <div class="sign"><span class="r-label">المديرة</span><b>${esc(SITE.principalName)}</b></div>
    </div>
  </article>
  <div class="actions" style="margin-top:16px"><button class="btn btn-pdf btn-soft" type="button" id="viewBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>مشاهدة</button><button class="btn btn-pdf" type="button" id="pdfBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>تحميل PDF</button><button class="ghost" type="button" id="again">استعلام عن طالبة أخرى</button></div>`;

  $("#result").hidden = false;
  if (sc.has) requestAnimationFrame(() => requestAnimationFrame(() => {
    const ring = $("#ringFg");
    ring.style.stroke = sc.pct >= 80 ? "var(--gold)" : "var(--accent)";
    ring.style.strokeDashoffset = C * (1 - Math.min(sc.pct, 100) / 100);
  }));

  $("#copyBtn").addEventListener("click", e => {
    const b = e.currentTarget;
    navigator.clipboard?.writeText(email).then(() => { b.textContent = "تم النسخ"; setTimeout(() => b.textContent = "نسخ", 1600); })
      .catch(() => { const range = document.createRange(); range.selectNodeContents($("#emailText")); const s = getSelection(); s.removeAllRanges(); s.addRange(range); });
  });
  $("#viewBtn").addEventListener("click", openViewer);
  $("#pdfBtn").addEventListener("click", e => downloadPdf(e.currentTarget));
  $("#again").addEventListener("click", () => {
    $("#result").hidden = true; $("#result").innerHTML = "";
    $("#nid").value = ""; $("#nid").focus();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  $("#result").scrollIntoView({ behavior: "smooth", block: "start" });
}

function showError(msg) { const e = $("#err"); e.textContent = msg; e.hidden = false; $("#result").hidden = true; }

$("#nid").addEventListener("input", e => {
  const v = toLatin(e.target.value).slice(0, 10);
  if (e.target.value !== v) e.target.value = v;
  $("#err").hidden = true;
});

$("#lookupForm").addEventListener("submit", async e => {
  e.preventDefault();
  const v = toLatin($("#nid").value);
  if (v.length < 9) return showError("تأكدي من رقم الهوية: يجب أن يكون 10 أرقام.");
  const btn = $("#lookupForm .btn");
  btn.disabled = true; btn.textContent = "جارٍ البحث…";
  try {
    const r = await findStudent(v);
    if (r === "closed") return showClosed();
    if (!r) return showError("لم نجد طالبة بهذا الرقم. راجعي الرقم أو تواصلي مع المعلمة.");
    $("#err").hidden = true;
    render(r);
  } catch (err) {
    showError(err.message === "rate_limited" ? "محاولات كثيرة خلال وقت قصير. حاولي بعد عشر دقائق." : "تعذّر الاتصال بالخادم. حاولي مرة أخرى بعد قليل.");
  } finally {
    btn.disabled = false; btn.textContent = "استعلام";
  }
});

function showClosed() {
  $("#lookupForm").hidden = true; $("#result").hidden = true;
  $("#closedBox").hidden = false;
}

fetch("/api/site", { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(site => {
  if (!site) return;
  Object.assign(MAX, site.max);
  Object.assign(SITE, { gradeLabel: site.gradeLabel, termTitle: site.termTitle, teacherName: site.teacherName, principalName: site.principalName });
  $("#gradeLabel").textContent = gradeLine();
  $("#foot").textContent = `المعلمة: ${site.teacherName}` + (site.principalName ? ` · المديرة: ${site.principalName}` : "");
  $("#closedMsg").textContent = site.closedMessage;
  if (!site.open) showClosed();
}).catch(() => {});
</script>

</body>
</html>
