<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استعلام نتائج الطالبات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm column. A lookup slip on top; the result opens beneath it as a report card with a score ring, four measure tiles, learning style and signatures. */
:root {
  --bg: #eef4f2;
  --surface: #ffffff;
  --surface-2: #f5f9f8;
  --ink: #142a2e;
  --muted: #5b7277;
  --line: #d7e4e1;
  --accent: #0d6e6a;
  --accent-soft: #d6ece9;
  --gold: #b9800f;
  --gold-soft: #fbefd3;
  --good: #1f8a4c;
  --warn: #b86a00;
  --low: #b43c3c;
  --pattern: rgba(13, 110, 106, 0.07);
  --shadow: 0 1px 2px rgba(20, 42, 46, 0.06), 0 12px 32px -12px rgba(20, 42, 46, 0.18);
  --font-display: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1a1c; --surface: #142427; --surface-2: #192d31; --ink: #e6f0ee; --muted: #93aaae;
    --line: #26403f; --accent: #4fc2b8; --accent-soft: #163a3a; --gold: #e9b44c; --gold-soft: #3a2e14;
    --good: #5fcf8c; --warn: #f0a540; --low: #f08080; --pattern: rgba(79, 194, 184, 0.06);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -12px rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1a1c; --surface: #142427; --surface-2: #192d31; --ink: #e6f0ee; --muted: #93aaae;
  --line: #26403f; --accent: #4fc2b8; --accent-soft: #163a3a; --gold: #e9b44c; --gold-soft: #3a2e14;
  --good: #5fcf8c; --warn: #f0a540; --low: #f08080; --pattern: rgba(79, 194, 184, 0.06);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -12px rgba(0,0,0,.6); color-scheme: dark;
}

html { direction: rtl; }
* { box-sizing: border-box; }
body {
  background: var(--bg);
  background-image:
    radial-gradient(circle at 1px 1px, var(--pattern) 1.5px, transparent 0);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.7;
  min-height: 100vh;
}
.wrap {
  max-width: 760px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 56px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* Header */
.masthead { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.logos {
  display: flex; align-items: center; justify-content: center; gap: 20px;
  background: #ffffff; border: 1px solid var(--line); border-radius: 20px;
  padding: 14px 24px; margin-bottom: 10px; box-shadow: var(--shadow);
  max-width: 100%;
}
.logo { width: 150px; max-width: 40vw; height: auto; display: block; }
.logo-sep { width: 1px; align-self: stretch; background: #d7e4e1; }
.eyebrow { color: var(--accent); font-weight: 600; font-size: 14px; letter-spacing: .02em; }
h1 {
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(28px, 6vw, 40px); line-height: 1.3; margin: 0;
  text-wrap: balance;
}
.sub { color: var(--muted); margin: 0; font-size: 15px; }

/* Lookup */
[hidden] { display: none !important; }
.lookup {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 24px;
  display: flex; flex-direction: column; gap: 14px;
}
.lookup label { font-weight: 600; font-size: 15px; }
.field { display: flex; gap: 10px; flex-wrap: wrap; }
.field input {
  flex: 1 1 220px; min-width: 0;
  font: inherit; font-size: 20px; letter-spacing: .12em;
  font-variant-numeric: tabular-nums;
  direction: ltr; text-align: center;
  padding: 12px 16px;
  border: 2px solid var(--line); border-radius: 14px;
  background: var(--surface-2); color: var(--ink);
  transition: border-color .15s, box-shadow .15s;
}
.field input::placeholder { letter-spacing: .04em; color: var(--muted); opacity: .7; }
.field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.btn {
  font: inherit; font-weight: 700; font-size: 16px;
  padding: 12px 28px; border-radius: 14px; border: 0; cursor: pointer;
  background: var(--accent); color: var(--surface);
  transition: transform .1s, filter .15s;
}
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .7; cursor: wait; }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, .chip:focus-visible, .ghost:focus-visible, .copy:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.error {
  margin: 0; padding: 10px 14px; border-radius: 12px;
  background: color-mix(in srgb, var(--low) 12%, transparent); color: var(--low);
  font-weight: 500; font-size: 14px;
}
.samples { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); padding-top: 4px; border-top: 1px dashed var(--line); }
.chip {
  font: inherit; font-size: 13px; direction: ltr; font-variant-numeric: tabular-nums;
  padding: 4px 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
}
.chip:hover { border-color: var(--accent); color: var(--accent); }

/* Result card */
.result {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 24px;
  box-shadow: var(--shadow);
  overflow: hidden;
  animation: rise .45s ease-out both;
}
@keyframes rise { from { transform: translateY(12px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .result, .ring-fg { animation: none !important; transition: none !important; } }

.praise {
  display: flex; gap: 14px; align-items: center;
  padding: 16px 24px;
  background: var(--gold-soft); color: var(--ink);
  border-bottom: 1px solid var(--line);
}
.praise .star { flex: none; width: 40px; height: 40px; color: var(--gold); }
.praise strong { font-family: var(--font-display); font-size: 19px; display: block; line-height: 1.4; color: var(--gold); }
.praise span { font-size: 14.5px; }
.praise.calm { background: var(--accent-soft); }
.praise.calm strong, .praise.calm .star { color: var(--accent); }

.r-head {
  display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center;
  padding: 24px;
}
.r-head > div { min-width: 0; }
.r-label { color: var(--muted); font-size: 13px; }
.r-name { font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 5vw, 30px); line-height: 1.35; margin: 2px 0 10px; text-wrap: balance; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font-size: 13px; padding: 3px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tag.id { background: var(--surface-2); color: var(--muted); direction: ltr; font-variant-numeric: tabular-nums; font-weight: 500; border: 1px solid var(--line); }

.ring { position: relative; width: 116px; height: 116px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--surface-2); stroke-width: 10; }
.ring-fg { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 1s ease-out; }
.ring-val { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.1; }
.ring-val b { font-size: 28px; font-variant-numeric: tabular-nums; }
.ring-val small { font-size: 11.5px; color: var(--muted); }

.metrics {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;
  padding: 0 24px 24px;
}
.metric {
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 16px;
  padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
}
.m-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.m-name { font-size: 14px; color: var(--muted); font-weight: 500; }
.m-val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.m-val small { font-size: 13px; color: var(--muted); font-weight: 500; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.m-note { font-size: 12.5px; color: var(--muted); }
.pill { font-size: 12px; font-weight: 600; padding: 1px 10px; border-radius: 99px; }
.pill.good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.pill.low  { color: var(--low);  background: color-mix(in srgb, var(--low) 14%, transparent); }

.tests { padding: 0 24px 16px; }
.tests-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.tests-title { font-weight: 700; font-size: 16px; }
.tests-grid {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--surface-2);
}
.t-cell { padding: 14px 10px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
.t-cell + .t-cell { border-inline-start: 1px solid var(--line); }
.t-label { font-size: 13px; color: var(--muted); }
.t-val { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; }
.t-val small { font-size: 13px; color: var(--muted); font-weight: 500; }
.t-cell.key { background: var(--accent-soft); }
.t-cell.key .t-val { color: var(--accent); }
.section { padding: 20px 24px; border-top: 1px solid var(--line); display: flex; gap: 16px; align-items: center; }
.section > div { min-width: 0; }
.style-icon {
  flex: none; width: 52px; height: 52px; border-radius: 16px;
  display: grid; place-items: center; background: var(--accent-soft); color: var(--accent);
}
.style-icon svg { width: 28px; height: 28px; }
.s-title { font-weight: 700; font-size: 17px; }
.s-text { color: var(--muted); font-size: 14px; margin: 0; }

.email-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.email { direction: ltr; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 14.5px; overflow-wrap: anywhere; user-select: all; }
.copy {
  font: inherit; font-size: 12.5px; padding: 3px 12px; border-radius: 99px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--accent); font-weight: 600;
}

.signs {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  border-top: 1px solid var(--line); background: var(--surface-2);
}
.sign { padding: 18px 24px; text-align: center; }
.sign + .sign { border-inline-start: 1px solid var(--line); }
.sign .r-label { display: block; }
.sign b { font-family: var(--font-display); font-weight: 600; font-size: 17px; }

.actions { display: flex; justify-content: center; }
.ghost {
  font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;
  background: transparent; color: var(--accent); border: 1.5px solid var(--accent);
  padding: 8px 22px; border-radius: 12px;
}
.ghost:hover { background: var(--accent-soft); }

.foot { text-align: center; color: var(--muted); font-size: 12.5px; }
.sample-note { display: inline-block; margin-top: 4px; padding: 2px 10px; border-radius: 99px; background: var(--gold-soft); color: var(--gold); font-weight: 600; }

@media (max-width: 520px) {
  .wrap { padding-block: 24px 40px; }
  .lookup, .r-head, .praise { padding-inline: 18px; }
  .metrics { padding-inline: 18px; grid-template-columns: minmax(0, 1fr); }
  .tests { padding-inline: 18px; }
  .tests-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .t-cell:nth-child(3) { border-inline-start: 0; }
  .t-cell:nth-child(n+3) { border-top: 1px solid var(--line); }
  .section, .sign { padding-inline: 18px; }
  .r-head { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
  .tags { justify-content: center; }
  .btn { flex: 1 1 100%; }
}
.rpt-host { position: fixed; top: 0; left: -10000px; width: 210mm; pointer-events: none; }
.rpt { direction: rtl; background: #fff; }
.rpt * { box-sizing: border-box; margin: 0; }
.rpt { --navy:#2b2765; --teal:#0d6e6a; --mint:#8fc3ad; --mint-soft:#eaf5f0; --ink:#1d2433; --muted:#667085; --line:#dfe5ea; --gold:#b9800f; --gold-soft:#fdf3dc; }
.rpt { font-family: "IBM Plex Sans Arabic", Tahoma, sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.rpt .rp-sheet { width: 210mm; height: 297mm; position: relative; overflow: hidden; padding: 0; display: flex; flex-direction: column; }
.rpt .rp-band { height: 5mm; flex: none; display: flex; }
.rpt .rp-band i { flex: 65; background: var(--navy); }
.rpt .rp-band i + i { flex: 35; background: var(--mint); }
.rpt .rp-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 6mm 14mm 5mm; gap: 6mm; border-bottom: 1px solid var(--line); }
.rpt .rp-gov { font-size: 10.5pt; line-height: 1.75; font-weight: 600; color: var(--navy); }
.rpt .rp-gov span { display: block; font-weight: 500; color: var(--muted); font-size: 9.5pt; }
.rpt .rp-head img.rp-moe { height: 22mm; justify-self: center; }
.rpt .rp-head img.rp-school { height: 24mm; justify-self: end; }
.rpt .rp-title { text-align: center; padding: 4mm 14mm 3mm; }
.rpt .rp-title h1 { font-size: 20pt; font-weight: 700; color: var(--navy); letter-spacing: 0; }
.rpt .rp-title p { color: var(--muted); font-size: 10.5pt; margin-top: 1mm; }
.rpt .rp-body { padding: 0 14mm; display: flex; flex-direction: column; gap: 4mm; }
.rpt .rp-info { display: grid; grid-template-columns: 1fr auto; gap: 6mm; align-items: center; border: 1px solid var(--line); border-radius: 4mm; padding: 4mm 6mm; }
.rpt .rp-info dl { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 2.5mm 5mm; font-size: 11pt; }
.rpt .rp-info dt { color: var(--muted); }
.rpt .rp-info dd { font-weight: 600; }
.rpt .rp-info dd.rp-name { font-size: 15pt; font-weight: 700; color: var(--navy); grid-column: span 3; }
.rpt .rp-info dd.rp-mono { direction: ltr; text-align: right; font-variant-numeric: tabular-nums; }
.rpt .rp-score { width: 30mm; height: 30mm; display: block; }
.rpt h2 { font-size: 12.5pt; color: var(--navy); font-weight: 700; display: flex; align-items: center; gap: 2.5mm; margin-bottom: 2.5mm; }
.rpt h2::before { content: ""; width: 2.2mm; height: 2.2mm; border-radius: 50%; background: var(--mint); }
.rpt table { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--line); border-radius: 3mm; overflow: hidden; font-size: 11pt; }
.rpt th { background: var(--navy); color: #fff; font-weight: 600; padding: 2.8mm 3mm; font-size: 10.5pt; }
.rpt td { padding: 2.6mm 3mm; text-align: center; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.rpt th + th, .rp-rpt td + td { border-inline-start: 1px solid var(--line); }
.rpt td b { font-size: 14pt; }
.rpt td small { color: var(--muted); }
.rpt td.rp-key { background: var(--mint-soft); color: var(--teal); }
.rpt .rp-lvl { display: inline-block; font-size: 9pt; font-weight: 600; padding: .4mm 3mm; border-radius: 10mm; margin-top: 1mm; }
.rpt .rp-good { background: #e3f4ea; color: #1f7a45; }
.rpt .rp-warn { background: #fdf0dc; color: #9a5a00; }
.rpt .rp-low { background: #fbe4e4; color: #a33a3a; }
.rpt .rp-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; }
.rpt .rp-box { border: 1px solid var(--line); border-radius: 3mm; padding: 3mm 5mm; }
.rpt .rp-box .rp-k { color: var(--muted); font-size: 9.5pt; }
.rpt .rp-box .rp-v { font-weight: 700; font-size: 13pt; color: var(--navy); }
.rpt .rp-box .rp-t { font-size: 9.5pt; color: var(--muted); margin-top: 1mm; line-height: 1.7; }
.rpt .rp-box .rp-v.rp-mono { direction: ltr; text-align: right; font-size: 11.5pt; }
.rpt .rp-praise { background: var(--gold-soft); border-radius: 3mm; padding: 4mm 6mm; display: flex; gap: 4mm; align-items: center; }
.rpt .rp-praise svg { width: 11mm; height: 11mm; flex: none; color: var(--gold); }
.rpt .rp-praise b { display: block; color: var(--gold); font-size: 13.5pt; }
.rpt .rp-praise span { font-size: 10.5pt; }
.rpt .rp-signs { display: grid; grid-template-columns: 1fr 1fr; gap: 10mm; padding: 4mm 14mm 0; margin-top: auto; }
.rpt .rp-sign { text-align: center; }
.rpt .rp-sign .rp-k { color: var(--muted); font-size: 10pt; }
.rpt .rp-sign .rp-n { font-weight: 700; font-size: 12.5pt; color: var(--navy); margin-top: 1mm; }
.rpt .rp-sign .rp-line { border-bottom: 1px dashed #b9c2cc; height: 10mm; margin: 0 14mm; }
.rpt .rp-foot { display: flex; justify-content: space-between; padding: 4mm 14mm 4mm; font-size: 8.5pt; color: var(--muted); }
.actions { gap: 10px; flex-wrap: wrap; }
.closed { background: var(--surface, #fff); border: 1px solid var(--line); border-radius: 18px; padding: 28px 20px; text-align: center; box-shadow: var(--shadow); }
.closed svg { width: 40px; height: 40px; color: var(--accent); }
.closed p { margin: 10px 0 0; font-size: 17px; font-weight: 600; }
.btn-pdf { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 22px; font-size: 15px; }
.btn-pdf svg { width: 18px; height: 18px; }
</style>
</head>
<body>

<div class="wrap" dir="rtl" lang="ar">
  <header class="masthead">
    <div class="logos">
      <img class="logo" src="/img/moe.webp" alt="وزارة التعليم" width="150" height="113">
      <span class="logo-sep" aria-hidden="true"></span>
      <img class="logo" src="/img/school.webp" alt="الثانوية الثامنة والخمسون بعد المائة" width="150" height="131">
    </div>
    <div class="eyebrow" id="gradeLabel">الصف الثاني</div>
    <h1>استعلام نتائج الطالبات</h1>
    <p class="sub">اكتبي رقم الهوية لتظهر بطاقة النتيجة كاملة</p>
  </header>

  <form class="lookup" id="lookupForm" novalidate>
    <label for="nid">رقم الهوية الوطنية</label>
    <div class="field">
      <input id="nid" name="nid" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="١٠ أرقام" aria-describedby="nidHint">
      <button class="btn" type="submit">استعلام</button>
    </div>
    <p class="hint" id="nidHint">رقم الهوية مكوّن من 10 أرقام</p>
    <p class="error" id="err" role="alert" hidden></p>
  </form>

  <section id="result" aria-live="polite" hidden></section>

  <div class="closed" id="closedBox" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    <p id="closedMsg"></p>
  </div>

  <footer class="foot" id="foot">
    المعلمة: فائزة محمد جبوع · المديرة: د. حنان المطيري
  </footer>
</div>

<script>
document.documentElement.dir = "rtl";
document.documentElement.lang = "ar";
// ===== إعدادات الدرجات =====
const MAX = { test: 20, participation: 10, projects: 10 };
// Overwritten from /api/site, which the teacher controls from the panel.
const SITE = { gradeLabel: "الصف الثاني", termTitle: "", teacherName: "فائزة محمد جبوع", principalName: "د. حنان المطيري" };
const gradeLine = () => SITE.gradeLabel + (SITE.termTitle ? " · " + SITE.termTitle : "");

const STYLES = {
  "بصري":  { tip: "تتعلم أفضل بالصور والخرائط الذهنية والألوان والمخططات.", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>' },
  "سمعي":  { tip: "تتعلم أفضل بالاستماع والنقاش والشرح الصوتي والتكرار بصوت مسموع.", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.5a6 6 0 1 1 12 0c0 3.5-3 4.5-3 7.5a3 3 0 0 1-6 0"/><path d="M9.5 8.5a2.5 2.5 0 0 1 5 0"/></svg>' },
  "حركي":  { tip: "تتعلم أفضل بالتجربة والأنشطة العملية والحركة ولعب الأدوار.", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.4l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/></svg>' },

};

const STAR = '<svg class="star" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>';
const SPROUT = '<svg class="star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22V11"/><path d="M12 11C12 6 8 4 3 4c0 5 3 7 9 7z"/><path d="M12 14c0-4 3-6 9-6 0 4-3 6-9 6z"/></svg>';

async function findStudent(id) {
  const res = await fetch("/api/lookup", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }) });
  if (res.status === 404) return null;
  if (res.status === 403) return "closed";
  if (res.status === 429) throw new Error("rate_limited");
  if (!res.ok) throw new Error("server_error");
  return res.json();
}
const $ = s => document.querySelector(s);
const fmt = n => (Math.round(n * 100) / 100).toLocaleString("en-US", { maximumFractionDigits: 2 });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toLatin(s) {
  return s.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/\D/g, "");
}

function praiseFor(pct, first) {
  if (pct >= 95) return { cls: "", icon: STAR, title: `ما شاء الله يا ${first}! أداء متميز`, text: "نتيجتك تدل على اجتهاد وإصرار. أنتِ قدوة لزميلاتك، فاستمري على هذا التألق." };
  if (pct >= 90) return { cls: "", icon: STAR, title: `أحسنتِ يا ${first}، نتيجة ممتازة`, text: "جهدك واضح ومثمر. خطوة صغيرة بعد وتصلين للقمة." };
  if (pct >= 80) return { cls: "", icon: STAR, title: `رائعة يا ${first}، أنتِ على الطريق الصحيح`, text: "مستواك جميل جداً، ومع قليل من المراجعة ستكونين من المتفوقات." };
  if (pct >= 65) return { cls: "calm", icon: SPROUT, title: `بداية طيبة يا ${first}`, text: "عندك قدرات جميلة، وبالمراجعة المنتظمة ستلاحظين الفرق بسرعة." };
  return { cls: "calm", icon: SPROUT, title: `نثق بكِ يا ${first}`, text: "كل خطوة تقدّم تُحسب لك. معلمتك بجانبك، وبالتدريب المستمر تتحسن النتائج." };
}

function level(p) { return p >= 0.9 ? ["good", "ممتاز"] : p >= 0.75 ? ["good", "جيد جداً"] : p >= 0.6 ? ["warn", "جيد"] : ["low", "يحتاج دعم"]; }

function metric(name, val, max, note) {
  const p = Math.max(0, Math.min(1, val / max));
  const [c, t] = level(p);
  return `<div class="metric">
    <div class="m-top"><span class="m-name">${name}</span><span class="pill ${c}">${t}</span></div>
    <div class="m-val">${fmt(val)} <small>/ ${max}</small></div>
    <div class="bar" role="img" aria-label="${Math.round(p * 100)}%"><i style="width:${p * 100}%"></i></div>
    ${note ? `<div class="m-note">${note}</div>` : ""}
  </div>`;
}

function lateMetric(n) {
  const [c, t] = n === 0 ? ["good", "منضبطة"] : n <= 2 ? ["warn", "قليل"] : ["low", "متكرر"];
  return `<div class="metric">
    <div class="m-top"><span class="m-name">التأخير</span><span class="pill ${c}">${t}</span></div>
    <div class="m-val">${n === 0 ? "لا يوجد" : fmt(n)} <small>${n === 0 ? "" : n === 1 ? "مرة" : n === 2 ? "مرتان" : n >= 3 && n <= 10 ? "مرات" : "مرة"}</small></div>
    <div class="m-note">${n === 0 ? "لا يوجد تأخير، شكراً على انضباطك" : "الحضور المبكر يساعدك على الاستفادة من بداية الحصة"}</div>
  </div>`;
}


// ===== تصدير بطاقة النتيجة PDF =====
let currentStudent = null;
const LOGO_MOE = document.querySelectorAll(".logos img")[0]?.src || "";
const LOGO_SCHOOL = document.querySelectorAll(".logos img")[1]?.src || "";

function loadScript(src) {
  return new Promise((ok, fail) => {
    if (document.querySelector(`script[src="${src}"]`)) return ok();
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => fail(new Error("load_failed"));
    document.head.appendChild(s);
  });
}

function reportHTML(r) {
  const { id, name, class: cls, test1, test2, testAvg, participation, projects, lateness, learningStyle, email } = r;
  const t1 = Number(test1), t2 = Number(test2);
  const test = testAvg != null ? Number(testAvg) : (t1 + t2) / 2;
  const part = Number(participation), proj = Number(projects), late = Number(lateness) || 0;
  const total = test + part + proj, maxTotal = MAX.test + MAX.participation + MAX.projects;
  const pct = Math.round((total / maxTotal) * 100);
  const pr = praiseFor(pct, name.split(" ")[0]);
  const lv = v => { const [c, t] = level(v); return `<span class="rp-lvl rp-${c}">${t}</span>`; };
  const lateLv = late === 0 ? ["good", "منضبطة"] : late <= 2 ? ["warn", "قليل"] : ["low", "متكرر"];
  const st = STYLES[learningStyle];
  const today = new Date().toLocaleDateString("ar-SA-u-ca-gregory-nu-latn", { day: "numeric", month: "long", year: "numeric" });
  return { pct, html: `
<div class="rp-sheet">
  <div class="rp-band"><i></i><i></i></div>
  <div class="rp-head">
    <div class="rp-gov">المملكة العربية السعودية<span>وزارة التعليم</span><span>الإدارة العامة للتعليم بمنطقة الرياض</span><span>الثانوية الثامنة والخمسون بعد المائة</span></div>
    <img class="rp-moe" src="${LOGO_MOE}">
    <img class="rp-school" src="${LOGO_SCHOOL}">
  </div>
  <div class="rp-title"><h1>بطاقة نتيجة الطالبة</h1><p>${esc(gradeLine())}</p></div>
  <div class="rp-body">
    <div class="rp-info">
      <dl>
        <dt>اسم الطالبة</dt><dd class="rp-name">${esc(name)}</dd>
        <dt>رقم الهوية</dt><dd class="rp-mono">${esc(id)}</dd><dt>الفصل</dt><dd>${esc(cls || "")}</dd>
      </dl>
      <canvas class="rp-score" width="340" height="340" data-sub="${fmt(total)} من ${maxTotal}"></canvas>
    </div>
    <div>
      <h2>الاختبارات</h2>
      <table><tr><th>الاختبار الأول</th><th>الاختبار الثاني</th><th>المجموع</th><th>المتوسط</th></tr>
      <tr><td><b>${fmt(t1)}</b> <small>/ ${MAX.test}</small></td><td><b>${fmt(t2)}</b> <small>/ ${MAX.test}</small></td><td><b>${fmt(t1 + t2)}</b> <small>/ ${MAX.test * 2}</small></td><td class="rp-key"><b>${fmt(test)}</b> <small>/ ${MAX.test}</small><br>${lv(test / MAX.test)}</td></tr></table>
    </div>
    <div>
      <h2>التقييم المستمر</h2>
      <table><tr><th>المشاركة</th><th>المشاريع والمهام</th><th>التأخير</th></tr>
      <tr><td><b>${fmt(part)}</b> <small>/ ${MAX.participation}</small><br>${lv(part / MAX.participation)}</td><td><b>${fmt(proj)}</b> <small>/ ${MAX.projects}</small><br>${lv(proj / MAX.projects)}</td><td><b>${late === 0 ? "لا يوجد" : fmt(late)}</b><br><span class="rp-lvl rp-${lateLv[0]}">${lateLv[1]}</span></td></tr></table>
    </div>
    <div class="rp-row2">
      <div class="rp-box"><div class="rp-k">نمط التعلم</div><div class="rp-v">${esc(learningStyle || "لم يُحدَّد بعد")}</div><div class="rp-t">${esc(st ? st.tip : "سيُحدَّد نمط التعلم بعد استكمال المعلمة للتقييم.")}</div></div>
      <div class="rp-box"><div class="rp-k">الإيميل الوزاري</div><div class="rp-v rp-mono">${esc(email || "")}</div></div>
    </div>
    <div class="rp-praise">${STAR.replace('class="rp-star"', "")}<div><b>${esc(pr.title)}</b><span>${esc(pr.text)}</span></div></div>
  </div>
  <div class="rp-signs">
    <div class="rp-sign"><div class="rp-k">معلمة المادة</div><div class="rp-n">${esc(SITE.teacherName)}</div><div class="rp-line"></div></div>
    <div class="rp-sign"><div class="rp-k">مديرة المدرسة</div><div class="rp-n">${esc(SITE.principalName)}</div><div class="rp-line"></div></div>
  </div>
  <div class="rp-foot"><span>تاريخ الإصدار: ${today}</span><span>صادرة من نظام استعلام النتائج</span></div>
  <div class="rp-band"><i></i><i></i></div>
</div>` };
}

function drawRing(canvas, pct) {
  const c = canvas.getContext("2d"), s = canvas.width, r = s / 2 - 18;
  c.lineWidth = 30; c.lineCap = "butt";
  c.strokeStyle = "#e6efed"; c.beginPath(); c.arc(s / 2, s / 2, r, 0, Math.PI * 2); c.stroke();
  c.strokeStyle = "#0d6e6a"; c.beginPath(); c.arc(s / 2, s / 2, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(pct, 100) / 100); c.stroke();
  c.textAlign = "center"; c.direction = "rtl";
  c.fillStyle = "#1d2433"; c.font = '700 76px "IBM Plex Sans Arabic", Tahoma, sans-serif';
  c.fillText(pct + "%", s / 2, s / 2 + 18);
  c.fillStyle = "#667085"; c.font = '500 30px "IBM Plex Sans Arabic", Tahoma, sans-serif';
  c.fillText(canvas.dataset.sub, s / 2, s / 2 + 66);
}

async function downloadPdf(btn) {
  if (!currentStudent) return;
  fetch("/api/lookup/pdf", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: currentStudent.id }) }).catch(() => {});
  const label = btn.innerHTML;
  btn.disabled = true; btn.textContent = "جارٍ تجهيز الملف…";
  const host = document.createElement("div");
  host.className = "rpt-host";
  try {
    await Promise.all([
      loadScript("/vendor/html2canvas.min.js"),
      loadScript("/vendor/jspdf.umd.min.js"),
    ]);
    const { pct, html } = reportHTML(currentStudent);
    host.innerHTML = `<div class="rpt">${html}</div>`;
    document.body.appendChild(host);
    await document.fonts.ready;
    drawRing(host.querySelector("canvas.rp-score"), pct);
    await Promise.all([...host.querySelectorAll("img")].map(i => i.complete ? 0 : new Promise(ok => { i.onload = i.onerror = ok; })));
    const sheet = host.querySelector(".rp-sheet");
    const canvas = await html2canvas(sheet, { scale: 2.5, backgroundColor: "#ffffff", useCORS: true, logging: false });
    const pdf = new jspdf.jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });
    pdf.addImage(canvas.toDataURL("image/jpeg", 0.95), "JPEG", 0, 0, 210, 297);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(pdf.output("blob"));
    a.download = `نتيجة - ${currentStudent.name}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  } catch (err) {
    console.error(err);
    showError("تعذّر تجهيز ملف PDF. تأكدي من اتصال الإنترنت وحاولي مرة أخرى.");
  } finally {
    host.remove();
    btn.disabled = false; btn.innerHTML = label;
  }
}

function render(r) {
  currentStudent = r;
  const { id, name, class: cls, test1: t1, test2: t2, testAvg: avg, participation: part, projects: proj, lateness: lateRaw, learningStyle: style, email } = r;
  const test = avg != null ? Number(avg) : (Number(t1) + Number(t2)) / 2;
  const late = Number(lateRaw) || 0;
  const total = test + Number(part) + Number(proj);
  const maxTotal = MAX.test + MAX.participation + MAX.projects;
  const pct = Math.round((total / maxTotal) * 100);
  const first = name.split(" ")[0];
  const pr = praiseFor(pct, first);
  const st = STYLES[style] || { tip: "سيُحدَّد نمط التعلم بعد استكمال المعلمة للتقييم.", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2.5 2"/></svg>' };
  const C = 2 * Math.PI * 48;

  $("#result").innerHTML = `
  <article class="result">
    <div class="praise ${pr.cls}">${pr.icon}<div><strong>${esc(pr.title)}</strong><span>${esc(pr.text)}</span></div></div>
    <div class="r-head">
      <div>
        <div class="r-label">اسم الطالبة</div>
        <div class="r-name">${esc(name)}</div>
        <div class="tags"><span class="tag">${esc(SITE.gradeLabel)} · الفصل ${esc(cls)}</span><span class="tag id">${esc(id)}</span></div>
      </div>
      <div class="ring" role="img" aria-label="المجموع ${pct}%">
        <svg viewBox="0 0 116 116"><circle class="ring-bg" cx="58" cy="58" r="48"/><circle class="ring-fg" id="ringFg" cx="58" cy="58" r="48" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
        <div class="ring-val"><b>${pct}%</b><small>${fmt(total)} من ${maxTotal}</small></div>
      </div>
    </div>
    <div class="tests">
      <div class="tests-head"><span class="tests-title">الاختبارات</span>${(() => { const [c, t] = level(test / MAX.test); return `<span class="pill ${c}">${t}</span>`; })()}</div>
      <div class="tests-grid">
        <div class="t-cell"><span class="t-label">الاختبار الأول</span><span class="t-val">${fmt(Number(t1))} <small>/ ${MAX.test}</small></span></div>
        <div class="t-cell"><span class="t-label">الاختبار الثاني</span><span class="t-val">${fmt(Number(t2))} <small>/ ${MAX.test}</small></span></div>
        <div class="t-cell"><span class="t-label">المجموع</span><span class="t-val">${fmt(Number(t1) + Number(t2))} <small>/ ${MAX.test * 2}</small></span></div>
        <div class="t-cell key"><span class="t-label">المتوسط</span><span class="t-val">${fmt(test)} <small>/ ${MAX.test}</small></span></div>
      </div>
    </div>
    <div class="metrics">
      ${metric("المشاركة", Number(part), MAX.participation)}
      ${metric("المشاريع والمهام", Number(proj), MAX.projects)}
      ${lateMetric(late)}
    </div>
    <div class="section">
      <div class="style-icon" aria-hidden="true">${st.icon}</div>
      <div><div class="r-label">نمط التعلم</div><div class="s-title">${esc(style || "لم يُحدَّد بعد")}</div><p class="s-text">${esc(st.tip)}</p></div>
    </div>
    <div class="section">
      <div class="style-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div>
      <div><div class="r-label">الإيميل الوزاري</div><div class="email-row"><span class="email" id="emailText">${esc(email)}</span><button class="copy" type="button" id="copyBtn">نسخ</button></div></div>
    </div>
    <div class="signs">
      <div class="sign"><span class="r-label">المعلمة</span><b>${esc(SITE.teacherName)}</b></div>
      <div class="sign"><span class="r-label">المديرة</span><b>${esc(SITE.principalName)}</b></div>
    </div>
  </article>
  <div class="actions" style="margin-top:16px"><button class="btn btn-pdf" type="button" id="pdfBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>تحميل PDF</button><button class="ghost" type="button" id="again">استعلام عن طالبة أخرى</button></div>`;

  $("#result").hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const ring = $("#ringFg");
    ring.style.stroke = pct >= 80 ? "var(--gold)" : "var(--accent)";
    ring.style.strokeDashoffset = C * (1 - Math.min(pct, 100) / 100);
  }));

  $("#copyBtn").addEventListener("click", e => {
    const b = e.currentTarget;
    navigator.clipboard?.writeText(email).then(() => { b.textContent = "تم النسخ"; setTimeout(() => b.textContent = "نسخ", 1600); })
      .catch(() => { const range = document.createRange(); range.selectNodeContents($("#emailText")); const s = getSelection(); s.removeAllRanges(); s.addRange(range); });
  });
  $("#pdfBtn").addEventListener("click", e => downloadPdf(e.currentTarget));
  $("#again").addEventListener("click", () => {
    $("#result").hidden = true; $("#result").innerHTML = "";
    $("#nid").value = ""; $("#nid").focus();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  $("#result").scrollIntoView({ behavior: "smooth", block: "start" });
}

function showError(msg) { const e = $("#err"); e.textContent = msg; e.hidden = false; $("#result").hidden = true; }

$("#nid").addEventListener("input", e => {
  const v = toLatin(e.target.value).slice(0, 10);
  if (e.target.value !== v) e.target.value = v;
  $("#err").hidden = true;
});

$("#lookupForm").addEventListener("submit", async e => {
  e.preventDefault();
  const v = toLatin($("#nid").value);
  if (v.length < 9) return showError("تأكدي من رقم الهوية: يجب أن يكون 10 أرقام.");
  const btn = $("#lookupForm .btn");
  btn.disabled = true; btn.textContent = "جارٍ البحث…";
  try {
    const r = await findStudent(v);
    if (r === "closed") return showClosed();
    if (!r) return showError("لم نجد طالبة بهذا الرقم. راجعي الرقم أو تواصلي مع المعلمة.");
    $("#err").hidden = true;
    render(r);
  } catch (err) {
    showError(err.message === "rate_limited" ? "محاولات كثيرة خلال وقت قصير. حاولي بعد عشر دقائق." : "تعذّر الاتصال بالخادم. حاولي مرة أخرى بعد قليل.");
  } finally {
    btn.disabled = false; btn.textContent = "استعلام";
  }
});

function showClosed() {
  $("#lookupForm").hidden = true; $("#result").hidden = true;
  $("#closedBox").hidden = false;
}

fetch("/api/site", { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(site => {
  if (!site) return;
  Object.assign(MAX, site.max);
  Object.assign(SITE, { gradeLabel: site.gradeLabel, termTitle: site.termTitle, teacherName: site.teacherName, principalName: site.principalName });
  $("#gradeLabel").textContent = gradeLine();
  $("#foot").textContent = `المعلمة: ${site.teacherName}` + (site.principalName ? ` · المديرة: ${site.principalName}` : "");
  $("#closedMsg").textContent = site.closedMessage;
  if (!site.open) showClosed();
}).catch(() => {});
</script>
